# render.yaml — Render.com deployment blueprint
# In Render: New +  ->  Blueprint  ->  connect this repo. Render reads this file.
#
# This version has NO database: the app falls back to SQLite automatically
# (saved portfolios reset when the free instance restarts, which is fine for a demo).
# To add a permanent database later, create a free Postgres on Neon or Supabase
# and set its connection string as the DATABASE_URL environment variable in Render.

services:
  - type: web
    name: smart-investment-portfolio
    runtime: python
    plan: free
    buildCommand: pip install -r website/requirements.txt
    startCommand: gunicorn --chdir website --preload -w 2 -b 0.0.0.0:$PORT server:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: SECRET_KEY
        generateValue: true
     
