# render.yaml — Render.com deployment blueprint
# In Render: New +  ->  Blueprint  ->  connect this repo. Render reads this file.
#
# It creates a free web service AND a free PostgreSQL database, wires them
# together (DATABASE_URL), and generates a secret key automatically.
#
# Prefer to start simpler with no database? Delete the `databases:` block and the
# DATABASE_URL env var below — the app then uses SQLite (saved data resets when the
# free instance restarts, which is fine for a demo).

services:
  - type: web
    name: smart-investment-portfolio
    runtime: python
    plan: free
    buildCommand: pip install -r website/requirements.txt
    startCommand: gunicorn --chdir website --preload -w 2 -b 0.0.0.0:$PORT server:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sip-database
          property: connectionString

databases:
  - name: sip-database
    plan: free
